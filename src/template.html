<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<meta name="description" content="{{description}}">
<script>
  // 화면이 그려지기 전에 저장된 모드를 먼저 적용 (깜빡임 방지)
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">{{blogName}}</a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="다크 모드로 바꾸기" title="다크 모드로 바꾸기">
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<main class="wrap">
{{content}}
</main>
<footer class="site-footer">© {{year}} {{blogName}}</footer>
<script src="assets/main.js"></script>
</body>
</html>
